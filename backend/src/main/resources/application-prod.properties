# Perfil de producao (#74), ligado com SPRING_PROFILES_ACTIVE=prod (o Dockerfile e o railway.json ja sobem com ele).
# Vale o application.properties inteiro; aqui fica so o que muda em producao. Variaveis: docs/deploy.md.

# Porta: o Railway define PORT
server.port=${PORT:8080}
# O Railway termina o https num proxy e repassa X-Forwarded-Proto/Host: com isso a API sabe que a requisicao
# chegou por https (URLs montadas pela API saem com https e o Spring Security manda o HSTS)
server.forward-headers-strategy=framework
server.error.include-stacktrace=never

# Banco: sem o padrao localhost do desenvolvimento. DB_URL, DB_USERNAME e DB_PASSWORD sao obrigatorias
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
# Esquema so pelo Flyway: o Hibernate valida e nunca altera. Sem baseline automatico: o banco de producao
# nasce vazio e recebe a V1; um banco com tabelas e sem historico do Flyway faz a API parar na subida, em vez
# de ser marcado como V1 sem conferencia
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=false
spring.jpa.show-sql=false

# CORS so para as origens configuradas (ex.: https://rosiestore.com.br,https://www.rosiestore.com.br), sem o
# padrao localhost. Obrigatoria
rosie.cors.origens-permitidas=${CORS_ORIGENS}
# Endereco da loja (volta do Mercado Pago e links dos e-mails): sem o padrao localhost. Obrigatoria
rosie.loja.url=${ROSIE_LOJA_URL}

# Logs sem dados pessoais nem segredos: nada de SQL com valores, e o corpo dos e-mails (com o link de
# confirmacao) nunca vai para o log. A API nao usa cookies (token JWT no cabecalho Authorization)
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.com.rosie.backend.service.EmailSoNoLog=INFO
