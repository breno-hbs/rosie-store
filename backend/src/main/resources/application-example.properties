# Copie para application-local.properties (ignorado pelo git) e preencha.
# Alternativa: definir as variáveis de ambiente DB_URL, DB_USERNAME, DB_PASSWORD,
# JWT_SECRET, ROSIE_ADMIN_EMAIL e ROSIE_ADMIN_SENHA.
spring.datasource.url=jdbc:mysql://localhost:3306/rosie_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=sua_senha_aqui

# Segredo do JWT (JWT_SECRET), pelo menos 32 caracteres. Este valor é SÓ de desenvolvimento:
# em produção gere outro, ex.: openssl rand -base64 48
rosie.jwt.segredo=dev-local-nao-usar-em-producao-0123456789abcdef

# Admin inicial (ROSIE_ADMIN_EMAIL / ROSIE_ADMIN_SENHA): criado na primeira subida sem admin.
# Senha com pelo menos 8 caracteres; escolha a sua, não commite. Descomente para usar
# (linhas vazias aqui sobrescreveriam as variáveis de ambiente).
# rosie.admin.email=voce@exemplo.com
# rosie.admin.senha=

# Fotos dos produtos (CLOUDINARY_URL): copie a "API environment variable" do painel do Cloudinary
# (Settings > API Keys), no formato cloudinary://<api_key>:<api_secret>@<cloud_name>. Opcional:
# sem ela a API sobe normalmente e só o upload de fotos do painel responde 503. Descomente para usar.
# rosie.cloudinary.url=cloudinary://<api_key>:<api_secret>@<cloud_name>

# Frete (#23), opcional: sem token a API sobe normalmente e so o calculo de frete responde 503.
# Token: painel do Melhor Envio > Integracoes > Permissoes de acesso > Gerar token (escopo shipping-calculate).
# Token da sandbox (sandbox.melhorenvio.com.br) so funciona com a URL da sandbox; o de producao, com
# https://melhorenvio.com.br. O User-Agent leva o nome da aplicacao e um e-mail de contato tecnico.
# Descomente para usar.
# rosie.frete.melhor-envio.token=
# rosie.frete.melhor-envio.url=https://sandbox.melhorenvio.com.br
# rosie.frete.melhor-envio.user-agent=Rosie (seu-email@exemplo.com)
# rosie.frete.cep-origem=00000-000
# Sem token, para testar a tela do carrinho: opcoes fixas de desenvolvimento (CEP 99999-999 = sem opcoes).
# rosie.frete.simulado=true

# Pagamento (#24), opcional: sem as tres linhas abaixo a API sobe normalmente e so o checkout responde 503.
# No painel de desenvolvedor do Mercado Pago (Suas integracoes > aplicacao Checkout Pro):
# - access token de TESTE em Credenciais de teste (o de producao fica so no Railway, da conta da Roseane);
# - segredo do webhook em Webhooks > Assinatura secreta.
# A URL publica precisa ser https e chegar na API (no dev, um tunel como ngrok http 8080): o Mercado
# Pago manda o webhook para <url>/pagamentos/webhook. Descomente para usar.
# rosie.pagamento.mercado-pago.access-token=TEST-...
# rosie.pagamento.mercado-pago.segredo-webhook=
# rosie.api.url-publica=https://seu-tunel.ngrok-free.app
# Sem credencial, para testar o checkout inteiro: pagamento de mentira, aprovado ou recusado por uma
# pagina da loja (/pedido/{id}/pagamento-simulado).
# rosie.pagamento.simulado=true

# Etiqueta de envio (#25), opcional: usa o mesmo token e a mesma URL do frete. Sem eles, sem o CEP de origem
# ou sem os dados obrigatorios do remetente (nome, documento, telefone, logradouro, numero, bairro, cidade,
# UF), a API sobe normalmente e so o botao "Gerar etiqueta" do painel responde 503.
# O token precisa tambem dos escopos cart-read, cart-write, shipping-checkout, shipping-generate,
# shipping-print e shipping-tracking. Comprar a etiqueta debita o SALDO da conta do Melhor Envio (na
# sandbox, saldo de teste: adicione pelo painel da sandbox).
# Documento: CPF (11 digitos, pessoa fisica) ou CNPJ (14). Inscricao estadual so para CNPJ que tenha.
# Com rosie.frete.simulado=true a etiqueta tambem e de mentira (link para /etiqueta-simulada.html).
# Descomente para usar.
# rosie.etiqueta.remetente.nome=Rosie Store
# rosie.etiqueta.remetente.telefone=11999999999
# rosie.etiqueta.remetente.email=contato@rosiestore.com.br
# rosie.etiqueta.remetente.documento=00000000000
# rosie.etiqueta.remetente.inscricao-estadual=
# rosie.etiqueta.remetente.logradouro=Rua Exemplo
# rosie.etiqueta.remetente.numero=100
# rosie.etiqueta.remetente.complemento=
# rosie.etiqueta.remetente.bairro=Centro
# rosie.etiqueta.remetente.cidade=Sao Paulo
# rosie.etiqueta.remetente.uf=SP

# Entrega pelo rastreio (#64), opcional: com o token do Melhor Envio (e a configuracao da etiqueta acima), a API
# consulta o rastreio dos pedidos ENVIADO a cada intervalo e marca sozinha os entregues. Sem token nao roda.
# Com rosie.frete.simulado=true, a etiqueta simulada conta como entregue no dia: um intervalo curto mostra a
# rodada funcionando. Para testar o botao "Marcar como entregue" em vez da rotina, desligue. Descomente para usar.
# rosie.rastreio.ativo=true
# rosie.rastreio.intervalo=30s
# rosie.rastreio.lote=50
# rosie.rastreio.pausa=1s

# E-mail a cliente (#65), opcional: sem a chave a API sobe normalmente e os e-mails (ex.: troca aprovada,
# recusada ou concluida) nao saem, so ficam no log com o destinatario mascarado e o assunto.
# Chave: painel do Resend (resend.com) > API Keys > Create API Key (permissao "Sending access").
# O remetente precisa estar num dominio verificado no Resend (Domains > Add Domain, com os registros
# SPF e DKIM no DNS); sem isso o Resend recusa e o erro vai para o log. Para testar antes de verificar
# o dominio, o Resend aceita o remetente onboarding@resend.dev, mas so entrega no e-mail da propria conta.
# O responder-para (opcional) recebe as respostas da cliente; vazio = as respostas vao para o remetente.
# O WhatsApp (DDI + DDD, so digitos, o mesmo de VITE_WHATSAPP_NUMERO) aparece no e-mail como contato.
# Descomente para usar.
# rosie.email.resend.api-key=re_...
# rosie.email.remetente=Rosie <contato@rosiestore.com.br>
# rosie.email.responder-para=
# rosie.loja.whatsapp=5511999999999
