spring.application.name=backend

# Credenciais locais (opcional, ignorado pelo git): copie application-example.properties
spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rosie_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# Esquema do banco pelo Flyway (#74): as migracoes ficam em src/main/resources/db/migration e rodam na subida.
# O Hibernate so confere se as entidades batem com as tabelas (validate) e nunca altera o banco: mudou uma
# entidade, crie a migracao seguinte (V2__descricao.sql, V3__...).
spring.jpa.hibernate.ddl-auto=validate
# Banco de desenvolvimento criado pelo Hibernate antes do Flyway (sem a tabela flyway_schema_history): na
# primeira subida ele e marcado como ja estando na V1 (baseline), sem recriar nem apagar nada. Banco vazio
# (CI, banco novo) recebe a V1 normalmente. Desligado no perfil prod.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=esquema criado pelo Hibernate antes do Flyway
# SQL no console (so os comandos, com "?" no lugar dos valores): ligue com JPA_SHOW_SQL=true para depurar.
# Desligado por padrao para nao encher o log da hospedagem (#31).
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Health check (#74): GET /actuator/health responde {"status":"UP"} (ou 503 DOWN, ex.: sem banco), sem detalhes
# nem componentes. E o caminho que o Railway consulta antes de trocar a versao no ar. Nenhum outro endpoint do
# Actuator fica ligado nem exposto, e a pagina /actuator (lista de links) tambem nao.
management.endpoints.access.default=none
management.endpoint.health.access=read-only
management.endpoints.web.exposure.include=health
management.endpoints.web.discovery.enabled=false
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=false

# Origens liberadas no CORS (separadas por virgula). Em producao incluir https://rosiestore.com.br
rosie.cors.origens-permitidas=${CORS_ORIGENS:http://localhost:5173}

# JWT do painel admin (HS256, validade de 2h). JWT_SECRET e obrigatorio, com pelo menos 32 caracteres.
rosie.jwt.segredo=${JWT_SECRET}
rosie.jwt.validade=2h

# Admin inicial: criado na subida so enquanto nao existir nenhum ADMIN (depois as variaveis sao ignoradas)
rosie.admin.nome=${ROSIE_ADMIN_NOME:Roseane}
rosie.admin.email=${ROSIE_ADMIN_EMAIL:}
rosie.admin.senha=${ROSIE_ADMIN_SENHA:}

# Fotos dos produtos no Cloudinary (#15), no formato cloudinary://<api_key>:<api_secret>@<cloud_name>.
# Sem ela a API sobe normalmente e o upload responde 503 ARMAZENAMENTO_INDISPONIVEL.
rosie.cloudinary.url=${CLOUDINARY_URL:}

# Upload de foto: JPG, PNG ou WEBP de ate 5 MB (acima disso, 400 ARQUIVO_MUITO_GRANDE).
# O max-swallow-size deixa o Tomcat ler o resto de um arquivo grande demais e responder o 400,
# em vez de derrubar a conexao. A requisicao toda vai ate 12 MB: o banner (#89) manda duas imagens de uma vez.
rosie.imagens.tamanho-maximo=5MB
spring.servlet.multipart.max-file-size=${rosie.imagens.tamanho-maximo}
spring.servlet.multipart.max-request-size=12MB
server.tomcat.max-swallow-size=20MB

# Frete pelo Melhor Envio (#23). Sem MELHOR_ENVIO_TOKEN ou sem ROSIE_CEP_ORIGEM a API sobe normalmente
# e o calculo responde 503 FRETE_INDISPONIVEL. MELHOR_ENVIO_URL: https://sandbox.melhorenvio.com.br
# (padrao, token da sandbox) ou https://melhorenvio.com.br (producao, token da conta real).
# O User-Agent e exigido pelo Melhor Envio: nome da aplicacao e e-mail de contato tecnico.
rosie.frete.melhor-envio.token=${MELHOR_ENVIO_TOKEN:}
rosie.frete.melhor-envio.url=${MELHOR_ENVIO_URL:https://sandbox.melhorenvio.com.br}
rosie.frete.melhor-envio.user-agent=${MELHOR_ENVIO_USER_AGENT:Rosie (rosiestore.com.br)}
rosie.frete.cep-origem=${ROSIE_CEP_ORIGEM:}
rosie.frete.timeout=${FRETE_TIMEOUT:5s}
# So para desenvolvimento: opcoes fixas sem chamar o Melhor Envio. Nunca ligar em producao.
rosie.frete.simulado=${FRETE_SIMULADO:false}

# Pacote padrao por peca, enquanto o produto nao tem peso nem medidas: 0,3 kg numa embalagem de
# 20 x 5 x 30 cm (largura x altura x comprimento). O Melhor Envio junta as pecas nos pacotes.
rosie.frete.peca.peso-kg=0.3
rosie.frete.peca.largura-cm=20
rosie.frete.peca.altura-cm=5
rosie.frete.peca.comprimento-cm=30

# Pagamento pelo Mercado Pago, Checkout Pro (#24). Faltando MERCADO_PAGO_ACCESS_TOKEN,
# MERCADO_PAGO_WEBHOOK_SECRET ou ROSIE_API_URL (https), a API sobe normalmente e o checkout responde
# 503 PAGAMENTO_INDISPONIVEL. Access token de teste (sandbox) ou de producao, da conta da Roseane.
# O segredo e a "assinatura secreta" da aba Webhooks da aplicacao no painel do Mercado Pago.
rosie.pagamento.mercado-pago.access-token=${MERCADO_PAGO_ACCESS_TOKEN:}
rosie.pagamento.mercado-pago.segredo-webhook=${MERCADO_PAGO_WEBHOOK_SECRET:}
rosie.pagamento.timeout=${PAGAMENTO_TIMEOUT:10s}
# So para desenvolvimento: pagamento de mentira, aprovado ou recusado pela tela. Nunca ligar em producao.
rosie.pagamento.simulado=${PAGAMENTO_SIMULADO:false}

# URL publica da API (o Mercado Pago manda o webhook para <url>/pagamentos/webhook; precisa ser https)
# e da loja (para onde o Mercado Pago devolve a cliente depois de pagar: <url>/pedido/{id}/sucesso...)
rosie.api.url-publica=${ROSIE_API_URL:}
rosie.loja.url=${ROSIE_LOJA_URL:http://localhost:5173}

# Etiqueta de envio pelo Melhor Envio (#25), gerada pelo botao do painel (nunca sozinha: comprar debita o
# saldo da conta). Usa o token, a URL, o User-Agent e o CEP de origem do frete, mais os dados do remetente
# (a loja) que saem na etiqueta. Faltando o token, o CEP ou um dado obrigatorio do remetente, a API sobe
# normalmente e so a etiqueta responde 503 ETIQUETA_INDISPONIVEL. Documento: CPF ou CNPJ, so os numeros.
# Com FRETE_SIMULADO=true a etiqueta tambem e de mentira.
rosie.etiqueta.remetente.nome=${ROSIE_REMETENTE_NOME:}
rosie.etiqueta.remetente.telefone=${ROSIE_REMETENTE_TELEFONE:}
rosie.etiqueta.remetente.email=${ROSIE_REMETENTE_EMAIL:}
rosie.etiqueta.remetente.documento=${ROSIE_REMETENTE_DOCUMENTO:}
rosie.etiqueta.remetente.inscricao-estadual=${ROSIE_REMETENTE_INSCRICAO_ESTADUAL:}
rosie.etiqueta.remetente.logradouro=${ROSIE_REMETENTE_LOGRADOURO:}
rosie.etiqueta.remetente.numero=${ROSIE_REMETENTE_NUMERO:}
rosie.etiqueta.remetente.complemento=${ROSIE_REMETENTE_COMPLEMENTO:}
rosie.etiqueta.remetente.bairro=${ROSIE_REMETENTE_BAIRRO:}
rosie.etiqueta.remetente.cidade=${ROSIE_REMETENTE_CIDADE:}
rosie.etiqueta.remetente.uf=${ROSIE_REMETENTE_UF:}
rosie.etiqueta.timeout=${ETIQUETA_TIMEOUT:20s}

# Troca e devolucao (#27): a cliente pede a troca ate N dias corridos depois da entrega (marcada pela Roseane
# no painel), contando o ultimo dia inteiro. Padrao de 7 dias: direito de arrependimento do CDC (art. 49)
# para compra fora da loja fisica. Pode aumentar se a Roseane quiser; menos de 7 descumpre o CDC.
rosie.troca.prazo-dias=${TROCA_PRAZO_DIAS:7}

# Entrega pelo rastreio (#64): a cada ROSIE_RASTREIO_INTERVALO a API consulta no Melhor Envio os pedidos ENVIADO
# com codigo de rastreio e, quando a transportadora informa a entrega, marca ENTREGUE com a data de la (abre o
# prazo de troca). No maximo ROSIE_RASTREIO_LOTE pedidos por rodada, com ROSIE_RASTREIO_PAUSA entre as consultas;
# os outros ficam para a rodada seguinte. Usa o token, a URL e a configuracao da etiqueta: sem MELHOR_ENVIO_TOKEN
# nao roda (avisa uma vez no log). ROSIE_RASTREIO_ATIVO=false desliga; o botao "Marcar como entregue" continua.
rosie.rastreio.ativo=${ROSIE_RASTREIO_ATIVO:true}
rosie.rastreio.intervalo=${ROSIE_RASTREIO_INTERVALO:6h}
rosie.rastreio.lote=${ROSIE_RASTREIO_LOTE:50}
rosie.rastreio.pausa=${ROSIE_RASTREIO_PAUSA:1s}
# Primeira rodada um pouco depois de a API subir
rosie.rastreio.atraso-inicial=1m

# E-mail a cliente pelo Resend (#65; a #61 reaproveita). Sem RESEND_API_KEY a API sobe normalmente e o
# e-mail so vai para o log (destinatario mascarado e assunto, sem o corpo). O envio sai depois do commit,
# numa fila propria: falha ou demora do Resend nunca desfaz nem segura a acao que disparou o e-mail, so
# vai para o log. O remetente precisa estar num dominio verificado no Resend (SPF e DKIM).
rosie.email.resend.api-key=${RESEND_API_KEY:}
rosie.email.remetente=${ROSIE_EMAIL_REMETENTE:Rosie <contato@rosiestore.com.br>}
# Para onde vao as respostas da cliente (opcional; vazio = para o remetente)
rosie.email.responder-para=${ROSIE_EMAIL_RESPONDER_PARA:}
rosie.email.timeout=${EMAIL_TIMEOUT:10s}
# WhatsApp da loja com DDI e DDD, so digitos (o mesmo de VITE_WHATSAPP_NUMERO), mostrado nos e-mails
rosie.loja.whatsapp=${ROSIE_WHATSAPP_NUMERO:}

# Troca de e-mail da cliente na Minha Conta (#61): o link de confirmacao mandado ao e-mail novo vale por este
# prazo (padrao 24 horas) e leva a <ROSIE_LOJA_URL>/minha-conta/confirmar-email. Sem RESEND_API_KEY o link nao
# sai; para pegar o link no dev, ligue o log do corpo: logging.level.com.rosie.backend.service.EmailSoNoLog=DEBUG
rosie.conta.troca-email.validade=${ROSIE_TROCA_EMAIL_VALIDADE:24h}

# Esqueci minha senha (#93), da cliente e do admin: o link mandado ao e-mail da conta vale por este prazo (padrao
# 1 hora) e leva a <ROSIE_LOJA_URL>/redefinir-senha (cliente) ou /admin/redefinir-senha (admin). Como na troca de
# e-mail, sem RESEND_API_KEY o link so aparece no log com EmailSoNoLog em DEBUG.
rosie.senha.redefinicao.validade=${ROSIE_REDEFINICAO_SENHA_VALIDADE:1h}
# Limite de pedidos do link, contados na memoria da API (uma instancia so): por e-mail e por IP, numa janela fixa.
# Passou do limite, 429 MUITAS_TENTATIVAS ate a janela acabar
rosie.senha.esqueci.limite-email=${ROSIE_ESQUECI_SENHA_LIMITE_EMAIL:3}
rosie.senha.esqueci.limite-ip=${ROSIE_ESQUECI_SENHA_LIMITE_IP:10}
rosie.senha.esqueci.janela=${ROSIE_ESQUECI_SENHA_JANELA:1h}
