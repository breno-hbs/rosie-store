# Perfil de demonstracao (#77), ligado com SPRING_PROFILES_ACTIVE=demo pelo scripts/demo.ps1 (passo a passo em
# docs/demonstracao.md). Roda no computador do Breno, para a Roseane ver a loja inteira sem nenhuma conta paga:
# frete, etiqueta e pagamento de mentira, e-mail so no log, num banco separado. Vale o application.properties
# (e o application-local.properties, com a senha do MySQL, o JWT e o Cloudinary); aqui fica so o que muda.
# Nunca junto com o perfil prod: a API se recusa a subir (PerfilDemo).

# Banco proprio da demonstracao, criado vazio na primeira subida (o Flyway aplica as migracoes): os dados do
# rosie_db de desenvolvimento nao aparecem no link publico. Sem baseline: o rosie_demo nasce pelo Flyway.
# Para comecar do zero: DROP DATABASE rosie_demo; no MySQL.
spring.datasource.url=${DEMO_DB_URL:jdbc:mysql://localhost:3306/rosie_demo?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.flyway.baseline-on-migrate=false
spring.jpa.show-sql=false

# Admin de demonstracao, criado na primeira subida do rosie_demo (nunca a senha do admin real nem a de
# desenvolvimento). O scripts/demo.ps1 gera a senha se ROSIE_DEMO_ADMIN_SENHA nao estiver definida
rosie.admin.nome=Roseane
rosie.admin.email=${ROSIE_DEMO_ADMIN_EMAIL:admin@rosie.demo}
rosie.admin.senha=${ROSIE_DEMO_ADMIN_SENHA:}

# Endereco por onde a loja e aberta: o link do tunel quando ele esta ligado (o script define), senao o localhost.
# Vai no link da etiqueta simulada e nos links dos e-mails (que so vao para o log)
rosie.loja.url=${ROSIE_LOJA_URL:http://localhost:5173}
# O front da demo chama a API pelo proxy do Vite (/api), no mesmo endereco da loja: nao ha CORS no caminho
rosie.cors.origens-permitidas=http://localhost:5173

# Frete, etiqueta e rastreio simulados (sem o Melhor Envio nem saldo) e pagamento simulado (sem o Mercado Pago):
# o checkout leva a pagina /pedido/{id}/pagamento-simulado, com os botoes Aprovar, Recusar e Cancelar
rosie.frete.simulado=true
rosie.pagamento.simulado=true
# Nenhuma credencial real e usada, mesmo que o application-local.properties tenha alguma
rosie.frete.melhor-envio.token=
rosie.pagamento.mercado-pago.access-token=
rosie.pagamento.mercado-pago.segredo-webhook=
rosie.api.url-publica=
# E-mail so no log (destinatario mascarado e assunto): nada sai para a caixa de ninguem
rosie.email.resend.api-key=

# Dados de exemplo da loja na etiqueta simulada e no endereco de devolucao da troca "nao serviu" (nunca o
# endereco real, que apareceria no link publico)
rosie.frete.cep-origem=01310-100
rosie.etiqueta.remetente.nome=Rosie Store
rosie.etiqueta.remetente.telefone=11999999999
rosie.etiqueta.remetente.email=contato@rosiestore.com.br
rosie.etiqueta.remetente.documento=00000000000
rosie.etiqueta.remetente.inscricao-estadual=
rosie.etiqueta.remetente.logradouro=Rua de Exemplo
rosie.etiqueta.remetente.numero=100
rosie.etiqueta.remetente.complemento=
rosie.etiqueta.remetente.bairro=Centro
rosie.etiqueta.remetente.cidade=Sao Paulo
rosie.etiqueta.remetente.uf=SP

# A etiqueta simulada ja conta como entregue no dia: com rodadas a cada minuto, o pedido enviado vira ENTREGUE
# sozinho logo depois (como a transportadora faria) e a troca pode ser mostrada na mesma chamada
rosie.rastreio.ativo=true
rosie.rastreio.atraso-inicial=30s
rosie.rastreio.intervalo=1m

# Log sem SQL e sem o corpo dos e-mails
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.com.rosie.backend.service.EmailSoNoLog=INFO
